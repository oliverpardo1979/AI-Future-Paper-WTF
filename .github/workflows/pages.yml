name: Build paper and deploy project site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "main_rewrite.tex"
      - "main_companion.tex"
      - "sections_rewrite/**"
      - "sections_companion/**"
      - "figures_rewrite/**"
      - "references.bib"
      - "literature/**"
      - "scripts/build_literature_database.py"
      - "scripts/test_literature_database.py"
      - "main*.tex"
      - "sections*/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Compile both manuscripts
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main_rewrite.tex
            main_companion.tex
      - name: Publish both papers at their permanent paths
        run: |
          mkdir -p docs/paper
          cp main_rewrite.pdf docs/paper/the-future-of-growth-and-human-labor-under-recursive-ai-self-improvement.pdf
          cp main_companion.pdf docs/paper/how-much-can-recursive-ai-self-improvement-raise-economic-growth.pdf
      - name: Rebuild and validate literature browser
        run: |
          python3 -m unittest discover -s scripts -p test_literature_database.py
          python3 scripts/build_literature_database.py --publish
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
