name: Build paper and deploy project site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "main_rewrite.tex"
      - "sections_rewrite/**"
      - "figures_rewrite/**"
      - "references.bib"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Compile current paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main_rewrite.tex
      - name: Publish the current paper at a permanent path
        run: |
          mkdir -p docs/paper
          cp main_rewrite.pdf docs/paper/the-future-of-growth-and-human-labor-under-recursive-ai-self-improvement.pdf
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
