name: Publish legacy links to the current paper

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_legacy_redirects.py"
      - "scripts/test_legacy_redirects.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build and validate legacy redirects without changing the archive
        run: |
          python3 -m unittest discover -s scripts -p test_legacy_redirects.py
          python3 scripts/build_legacy_redirects.py --output build/legacy-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/legacy-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
