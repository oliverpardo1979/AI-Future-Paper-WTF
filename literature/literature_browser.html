<style>
:root{
  --ink:#17231d;--muted:#607067;--line:#dce4df;--paper:#f7f9f7;--card:#fff;
  --accent:#176b4d;--tag:#e7f3ed;--warn:#fff5e8
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#123d2f;color:white;padding:2.4rem max(5vw,1rem)}
header h1{margin:0 0 .45rem;font:clamp(2rem,5vw,3.5rem)/1.1 Georgia,serif}
header p{margin:.25rem 0;color:#dbeae3;max-width:74rem}
.build{font-size:.82rem;opacity:.82}
.controls{
  position:sticky;top:0;z-index:2;display:grid;
  grid-template-columns:minmax(16rem,2fr) repeat(4,minmax(10rem,1fr));gap:.7rem;
  padding:1rem max(5vw,1rem);background:#f7f9f7ef;border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px)
}
label{display:grid;gap:.25rem;color:var(--muted);font-size:.78rem;font-weight:700}
input,select{
  width:100%;padding:.75rem;border:1px solid #aebbb4;border-radius:.45rem;
  background:white;color:var(--ink);font:400 1rem/1.2 system-ui,-apple-system,Segoe UI,sans-serif
}
.summary{padding:1rem max(5vw,1rem) 0;color:var(--muted)}
main{display:grid;gap:1rem;padding:1rem max(5vw,1rem) 3rem}
article{
  background:var(--card);border:1px solid var(--line);border-radius:.65rem;padding:1.2rem;
  box-shadow:0 2px 10px #163c2910
}
article.axm{border-left:5px solid var(--accent)}
h2{font:1.35rem/1.25 Georgia,serif;margin:.25rem 0}
.meta{color:var(--muted);margin:.3rem 0 .8rem}
.abstract{max-width:82rem}
.abstract h3,.review h3{
  margin:.9rem 0 .25rem;font-size:.82rem;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted)
}
.abstract p{margin:.2rem 0}
.tags,.links{display:flex;gap:.4rem;flex-wrap:wrap}
.tag{background:var(--tag);color:#14583f;border-radius:999px;padding:.15rem .55rem;font-size:.78rem}
.tag.core{background:#d9eee4;font-weight:750}
.tag.legacy{background:#eef0ec;color:#536157}
.tag.topic{background:#f0f4f1;color:#405a4b}
.review{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin-top:1rem}
.review section{background:#f4f8f5;border-radius:.45rem;padding:.75rem}
.review section.limit{background:var(--warn)}
.review h3{margin:0 0 .25rem}
.review p{margin:0}
.links{gap:1rem;margin-top:.9rem}
a{color:var(--accent);font-weight:650}
details{margin-top:.85rem;border-top:1px solid var(--line);padding-top:.65rem}
summary{cursor:pointer;color:var(--muted);font-weight:700}
.trace{display:grid;grid-template-columns:max-content 1fr;gap:.3rem .8rem;margin:.65rem 0 0;font-size:.86rem}
.trace dt{font-weight:750}
.trace dd{margin:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted)}
@media(max-width:1100px){
  .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .controls label:first-child{grid-column:1/-1}
}
@media(max-width:720px){
  .controls{grid-template-columns:1fr;position:static}
  .controls label:first-child{grid-column:auto}
  .review{grid-template-columns:1fr}
  .trace{grid-template-columns:1fr}
  .trace dd{margin-bottom:.4rem}
}
</style>

l.tex:976; sections_axm/03_model.tex:145; sections_rewrite/02_literature.tex:54; sections_rewrite/03_model.tex:142", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/03_model.tex:145", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:65; sections/02_literature.tex:122; sections/03_toy_model.tex:871; sections/03_toy_model.tex:976", "entry_type": "misc", "authors": "Yango, James Wabenga", "title": "Automation and Aging in General Equilibrium: AI Capital, Fertility, and the Return to Capital", "year": "2026", "venue": "arXiv:2606.22037", "volume": "", "number": "", "pages": "", "doi": "10.48550/arXiv.2606.22037", "document_url": "https://arxiv.org/abs/2606.22037", "landing_page_url": "https://doi.org/10.48550/arXiv.2606.22037", "abstract": "This paper develops a general equilibrium overlapping-generations model with endogenous fertility, in which firms accumulate both physical and artificial intelligence (AI) capital, and uses it to study the macroeconomic transmission of two structural disturbances: an AI technology shock and a longevity shock. The AI shock acts as a capital-demand disturbance: it raises all rates of return, most sharply the return to AI capital, reallocates investment from physical to AI capital, and produces a front-loaded output expansion that decays monotonically. The longevity shock acts as a saving-supply disturbance: it deepens the aggregate capital stock, compresses returns and the real interest rate, and generates hump-shaped, persistent dynamics. The two shocks move fertility in opposite directions: AI raises it modestly through an income effect, while longevity lowers it by strengthening the life-cycle saving motive and the cost of childrearing. A forecast-error variance decomposition attributes most aggregate volatility to the longevity shock, while the AI shock dominates the variance of the return to AI capital. Fertility is strongly countercyclical and almost perfectly negatively correlated with hours worked, placing household time allocation at the center of the mechanism. Robustness checks across the capital share, the shock persistence, and the utility specification show that only an empirically implausible labor-AI elasticity reverses the wage and fertility signs. A welfare analysis finds the AI shock welfare-improving under complementarity, whereas longevity produces a short-run welfare loss that recedes as capital deepening raises wages, since households initially compress consumption and fertility to finance a longer retirement.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W7165684671", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "acemoglu2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:36; sections/02_literature.tex:92; sections/04_task_extension.tex:14; sections_axm/03_model.tex:1666", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/03_model.tex:1666", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:36; sections/02_literature.tex:92; sections/04_task_extension.tex:14", "entry_type": "article", "authors": "Acemoglu, Daron", "title": "The Simple Macroeconomics of AI", "year": "2025", "venue": "Economic Policy", "volume": "40", "number": "121", "pages": "13--58", "doi": "10.1093/epolic/eiae042", "document_url": "https://doi.org/10.1093/epolic/eiae042", "landing_page_url": "https://doi.org/10.1093/epolic/eiae042", "abstract": "SUMMARY This paper evaluates claims about the large macroeconomic implications of new advances in Artificial intelligence (AI). It starts from a task-based model of AI’s effects, working through automation and task complementarities. So long as AI’s microeconomic effects are driven by cost savings/productivity improvements at the task level, its macroeconomic consequences will be given by a version of Hulten’s theorem: Gross Domestic Product (GDP) and aggregate productivity gains can be estimated by what fraction of tasks are impacted and average task-level cost savings. Using existing estimates on exposure to AI and productivity improvements at the task level, these macroeconomic effects appear non-trivial but modest – no more than a 0.66% increase in total factor productivity (TFP) over 10 years. The paper then argues that even these estimates could be exaggerated, because early evidence is from easy-to-learn tasks, whereas some of the future effects will come from hard-to-learn tasks, where there are many context-dependent factors affecting decision-making and no objective outcome measures from which to learn successful performance. Consequently, predicted TFP gains over the next 10 years are even more modest and are predicted to be less than 0.53%. I also explore AI’s wage and inequality effects. I show theoretically that even when AI improves the productivity of low-skill workers in certain tasks (without creating new tasks for them), this may increase rather than reduce inequality. Empirically, I find that AI advances are unlikely to increase inequality as much as previous automation technologies because their impact is more equally distributed across demographic groups, but there is also no evidence that AI will reduce labour income inequality. Instead, AI is predicted to widen the gap between capital and labour income. Finally, some of the new tasks created by AI may have negative social value (such as the design of algorithms for online manipulation), and I discuss how to incorporate the macroeconomic effects of new tasks that may have negative social value.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4401405116", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "andrewsfarboodi2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_axm/02_literature.tex:49; sections_axm/03_model.tex:1655", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:49; sections_axm/03_model.tex:1655", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Andrews, Isaiah and Farboodi, Maryam", "title": "Do Markets Believe in Transformative AI?", "year": "2025", "venue": "National Bureau of Economic Research", "volume": "", "number": "34243", "pages": "", "doi": "10.3386/w34243", "document_url": "https://www.nber.org/system/files/working_papers/w34243/w34243.pdf", "landing_page_url": "https://www.nber.org/papers/w34243", "abstract": "The paper studies U.S. bond yields around major frontier-model releases. Long-term Treasury and inflation-protected yields decline around releases interpreted as favorable news about AI progress, providing market evidence that complicates the standard prediction of higher real rates under transformative AI.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.nber.org/papers/w34243", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "transformative AI; bond yields; TIPS; event study; market expectations", "evidence_type": "financial-market event study", "method": "Small-sample inference around major frontier AI model releases, separating releases interpreted as favorable news about AI progress.", "key_results": "Long-term nominal and inflation-protected Treasury yields fall around favorable AI releases and remain lower for several weeks.", "use_in_axm": "Provides a direct empirical counterpoint to the model's positive balanced-gr i.org/10.1787/13e0da2f-en", "abstract": "", "abstract_type": "unavailable", "abstract_source_url": "", "metadata_source": "manual", "verification_status": "manual_doi", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "gans2025aiknowledge", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_rewrite/02_literature.tex:41", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Gans, Joshua S.", "title": "Growth in AI Knowledge", "year": "2025", "venue": "National Bureau of Economic Research", "volume": "", "number": "33907", "pages": "", "doi": "10.3386/w33907", "document_url": "https://www.nber.org/system/files/working_papers/w33907/w33907.pdf", "landing_page_url": "https://www.nber.org/papers/w33907", "abstract": "How does artificial intelligence affect the creation of new knowledge and long-run economic growth? This paper develops a general equilibrium model where AI enhances decision-making by interpolating between existing knowledge points. AI's impact on growth depends on a critical threshold in its capabilities: a modest interpolation range encourages incremental research and raises growth, whereas an extensive range promotes exploratory research that can reduce knowledge density and slow growth.", "abstract_type": "source_abstract", "abstract_source_url": "https://www.nber.org/papers/w33907", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "AI knowledge; research direction; capability threshold; market structure; economic growth", "evidence_type": "theory", "method": "General equilibrium model in which AI interpolates between knowledge points and changes incentives for incremental and exploratory research.", "key_results": "AI capabilities generate a threshold between research regimes, and market structure changes the associated growth and welfare effects.", "use_in_axm": "Provides a precedent for capability thresholds while clarifying that the current paper's threshold concerns production substitution and AI efficiency rather than research direction.", "limits_for_axm": "Its threshold does not separate labor-bottleneck from AI-dominated production and does not deliver the current paper's output-wage growth wedge.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "idetalamas2025", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Ide, Enrique and Talamàs, Eduard", "title": "Artificial Intelligence in the Knowledge Economy", "year": "2025", "venue": "Journal of Political Economy", "volume": "133", "number": "12", "pages": "3762--3813", "doi": "10.1086/737233", "document_url": "https://www.journals.uchicago.edu/doi/pdf/10.1086/737233", "landing_page_url": "https://www.journals.uchicago.edu/doi/abs/10.1086/737233", "abstract": "The paper studies how AI agents reshape hierarchical organizations built around differences in human knowledge. Compute can create either autonomous agents that solve problems independently or nonautonomous agents that assist people. These two forms of AI change organizational structure and distribute gains differently across the knowledge hierarchy.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.journals.uchicago.edu/doi/abs/10.1086/737233", "metadata_source": "University of Chicago Press", "verification_status": "official_landing_page", "topics": "artificial intelligence; knowledge economy; compute; AI agents; organization; labor income", "evidence_type": "theory", "method": "Competitive equilibrium model of knowledge hierarchies in which exogenous compute is converted into autonomous or nonautonomous AI agents.", "key_results": "AI autonomy changes organizational structure and the distribution of gains across human knowledge types; compute has an endogenous rental price but fixed aggregate supply.", "use_in_axm": "Closest precedent for treating compute as a rival input that produces scalable AI agents while preserving an explicit market price.", "limits_for_axm": "The model is static, has exogenous compute and zero economic profit, and does not include training or research feedback.", "notes": "Concise editorial synopsis of the official abstract; it is not author-written text.", "last_verified": "2026-09-04"}, {"citation_key": "iea2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:126; sections/01_introduction.tex:145; sections_axm/01_introduction.tex:67; sections_axm/01_introduction.tex:74", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/01_introduction.tex:67; sections_axm/01_introduction.tex:74", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:126; sections/01_introduction.tex:145", "entry_type": "techreport", "authors": "International Energy Agency", "title": "Energy and AI", "year": "2025", "venue": "International Energy Agency", "volume": "", "number": "", "pages": "", "doi": "", "document_url": "https://www.iea.org/reports/energy-and-ai", "landing_page_url": "https://www.iea.org/reports/energy-and-ai", "abstract": "The report studies the electricity required by data centers and artificial intelligence, the geographic concentration of demand, the scope for efficiency improvements, and the ways in which AI could also transform energy production and consumption.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.iea.org/reports/energy-and-ai", "metadata_source": "International Energy Agency", "verification_status": "official_landing_page", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "jones2025rd", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:42; sections/02_literature.tex:127; sections/04_task_extension.tex:14; sections_axm/02_literature.tex:33; sections_rewrite/02_literature.tex:12", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:33", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:42; sections/02_literature.tex:127; sections/04_task_extension.tex:14", "entry_type": "techreport", "authors": "Jones, Benjamin F.", "title": "Artificial Intelligence in Research and Development", "year": "2025", "venue": "National Bureau of Economic Research", "volume": "", "number": "34312", "pages": "", "doi": "10.3386/w34312", "document_url": "https://doi.org/10.3386/w34312", "landing_page_url": "https://doi.org/10.3386/w34312", "abstract": "How much can AI accelerate progress in different research fields?This paper shows that three features-the share of research tasks AI performs, the productivity of AI at those tasks, and the strength of bottlenecks-are key determinants of AI's implications in any area, from cancer therapeutics to software design.The model maps changes in AI capabilities to research outcomes, quantifies the \"marginal returns to intelligence,\" and shows how AI can shift returns to R&D investment.Concepts like superintelligence, Powerful AI, and Transformative AI are further engaged and disciplined.Finally, the framework sets a measurement agenda linking AI benchmarks to field-specific opportunities for accelerating progress.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4414867103", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "kokotajlo2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:300; sections/06_conclusion.tex:223", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:300; sections/06_conclusion.tex:223", "entry_type": "misc", "authors": "Kokotajlo, Daniel and Alexander, Scott and Larsen, Thomas and Lifland, Eli and Dean, Romeo", "title": "AI 2027", "year": "2025", "venue": "https://ai-2027.com/", "volume": "", "number": "", "pages": "", "doi": "", "document_url": "https://ai-2027.com/scenario.pdf", "landing_page_url": "https://ai-2027.com/", "abstract": "AI 2027 presents a scenario in which AI systems automate a growing share of AI research during 2027, rapidly produce systems with capabilities beyond those of human researchers, and create severe alignment and geopolitical risks. The scenario is a forecast exercise rather than an estimated economic model.", "abstract_type": "editorial_summary", "abstract_source_url": "https://ai-2027.com/summary", "metadata_source": "AI 2027", "verification_status": "official_landing_page", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "Scenario forecast published April 3, 2025", "last_verified": "2026-09-04"}, {"citation_key": "melinavilla2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_axm/02_literature.tex:45; sections_axm/03_model.tex:1651; sections_axm/03_model.tex:1655; sections_rewrite/02_literature.tex:68", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:45; sections_axm/03_model.tex:1651; sections_axm/03_model.tex:1655", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Melina, Giovanni and Villa, Stefania", "title": "From Servers to Rates: AI, ICT Capital, and the Natural Rate", "year": "2025", "venue": "International Monetary Fund", "volume": "", "number": "25/224", "pages": "", "doi": "", "document_url": "https://www.imf.org/-/media/Files/Publications/WP/2025/English/wpiea2025224-source-pdf.ashx", "landing_page_url": "https://www.elibrary.imf.org/view/journals/001/2025/224/article-A001-en.xml", "abstract": "The paper estimates a DSGE model with ICT capital and uses alternative AI-investment scenarios to study output, inflation, and the natural rate. The natural rate rises most when ICT complements labor, by as much as 0.7 percentage points, while strong substitutability can make the response small or negative.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.imf.org/-/media/Files/Publications/WP/2025/English/wpiea2025224-source-pdf.ashx", "metadata_source": "International Monetary Fund", "verification_status": "official_landing_page", "topics": "AI investment; ICT capital; natural rate of interest; labor complementarity; monetary policy", "evidence_type": "estimated DSGE model and scenario analysis", "method": "Bayesian DSGE model that separates ICT from conventional capital and varies the elasticity between ICT capital and labor.", "key_results": "AI-related ICT investment can raise growth and the natural rate, but the interest-rate response depends on whether ICT complements or substitutes for labor.", "use_in_axm": "Supports both the positive interest-rate response and the claim that its sign depends on the labor--AI substitution margin.", "limits_for_axm": "ICT capital is a stock distinct from the A×M model's AI service flow, and the paper studies short-run natural-rate dynamics with nominal rigidities.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "metrclaude2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:186; sections_axm/01_introduction.tex:82", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/01_introduction.tex:82", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:186", "entry_type": "misc", "authors": "Model Evaluation and Threat Research", "title": "Details about METR's Preliminary Evaluation of Claude 3.7", "year": "2025", "venue": "METR", "volume": "", "number": "", "pages": "", "doi": "", "document_url": "https://metr.org/evaluations/claude-3-7-report/", "landing_page_url": "https://metr.org/evaluations/claude-3-7-report/", "abstract": "METR's preliminary evaluation tests Claude 3.7 on a five-task subset of RE-Bench. With a 32-hour budget per task, the agent matched the median score of human experts given eight hours, while METR emphasizes that the comparison is preliminary and not directly comparable with every earlier evaluation.", "abstract_type": "editorial_summary", "abstract_source_url": "https://metr.org/evaluations/claude-3-7-report/", "metadata_source": "METR", "verification_status": "official_landing_page", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "oecdlongrun2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_axm/04_growth_regimes.tex:141; sections_rewrite/05_quantitative_equilibria.tex:29", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/04_growth_regimes.tex:141", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "OECD", "title": "OECD Global Long-Run Economic Scenarios: 2025 Update", "year": "2025", "venue": "OECD Publishing", "volume": "", "number": "36", "pages": "", "doi": "10.1787/00353678-en", "document_url": "https://doi.org/10.1787/00353678-en", "landing_page_url": "https://doi.org/10.1787/00353678-en", "abstract": "", "abstract_type": "unavailable", "abstract_source_url": "", "metadata_source": "manual", "verification_status": "manual_doi", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "rachel2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_axm/02_literature.tex:43; sections_axm/03_model.tex:1650; sections_rewrite/02_literature.tex:67", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:43; sections_axm/03_model.tex:1650", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Rachel, Lukasz", "title": "What Next for r*? A Capital Market Equilibrium Perspective on the Natural Rate of Interest", "year": "2025", "venue": "Brookings Papers on Economic Activity", "volume": "", "number": "", "pages": "131--187", "doi": "", "document_url": "https://www.brookings.edu/wp-content/uploads/2025/09/3_Rachel_unembargoed.pdf", "landing_page_url": "https://www.brookings.edu/articles/what-next-for-r/", "abstract": "The paper develops a structural capital-market equilibrium model for the natural rate of interest in advanced economies. Its scenario analysis shows that an AI-driven productivity boom can shift capital demand and household saving enough to raise the safe natural rate by more than one percentage point.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.brookings.edu/wp-content/uploads/2025/09/3_Rachel_unembargoed.pdf", "metadata_source": "Brookings Papers on Economic Activity", "verification_status": "official_landing_page", "topics": "natural rate of interest; AI productivity; capital demand; saving; advanced economies", "evidence_type": "structural model and scenario analysis", "method": "Capital-market equilibrium model with limited-foresight transitions and calibrated scenarios for productivity, demographics, fiscal policy, and risk premia.", "key_results": "The business-as-usual natural rate remains low, but the calibrated AI scenario raises the safe natural rate by more than one percentage point.", "use_in_axm": "Shows through a different macroeconomic mechanism that an AI productivity boom can raise the equilibrium real rate.", "limits_for_axm": "Its AI scenario is an imposed productivity process and combines several saving and investment channels absent from the A×M benchmark.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "restrepo2025agi", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_axm/01_introduction.tex:149; sections_axm/02_literature.tex:86; sections_axm/06_conclusion.tex:69; sections_rewrite/02_literature.tex:35; sections_rewrite/02_literature.tex:56", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/01_introduction.tex:149; sections_axm/02_literature.tex:86; sections_axm/06_conclusion.tex:69", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Restrepo, Pascual", "title": "We Won't Be Missed: Work and Growth in the AGI World", "year": "2025", "venue": "National Bureau of Economic Research", "volume": "", "number": "34423", "pages": "", "doi": "10.3386/w34423", "document_url": "https://www.nber.org/system/files/working_papers/w34423/w34423.pdf", "landing_page_url": "https://www.nber.org/papers/w34423", "abstract": "This chapter explores the long-run implications of Artificial General Intelligence (AGI) for economic growth and labor markets. AGI makes it feasible to perform all economically valuable work using compute. I distinguish between bottleneck and supplementary work—tasks that are essential versus non-essential for unhindered growth. As computational resources expand: (i) the economy automates all bottleneck work, (ii) some supplementary work may be left exclusively to humans, (iii) output becomes linear in compute and labor and its growth is driven by the expansion of compute, (iv) wages converge to the opportunity cost of computational resources required to reproduce human work, and (v) the share of labor income in GDP converges to zero.", "abstract_type": "source_abstract", "abstract_source_url": "https://www.nber.org/papers/w34423", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "AGI; compute; bottleneck work; labor share; wages; economic growth", "evidence_type": "theory", "method": "Long-run model in which AGI can reproduce all economically valuable bottleneck work using expanding compute.", "key_results": "Once compute can perform all bottleneck work, growth becomes compute-driven, wages are tied to compute's opportunity cost, and labor's income share converges to zero.", "use_in_axm": "Closest antecedent for the conditional limiting distribution in which the human bottleneck disappears and labor's share vanishes.", "limits_for_axm": "It characterizes the endpoint, not the endogenous delayed takeoff, monopoly rents, or the split between inference and research compute.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "stanfordaiindex2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:135", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:135", "entry_type": "techreport", "authors": "Stanford Institute for Human-Centered Artificial Intelligence", "title": "The 2025 AI Index Report", "year": "2025", "venue": "Stanford University", "volume": "", "number": "", "pages": "", "doi": "", "document_url": "https://hai.stanford.edu/ai-index/2025-ai-index-report", "landing_page_url": "https://hai.stanford.edu/ai-index/2025-ai-index-report", "abstract": "The 2025 AI Index synthesizes evidence on technical performance, investment, adoption, responsible AI, public opinion, education, and policy. It documents rapid improvements in benchmark performance and falling inference costs while emphasizing persistent limitations in reliability, transparency, and standardized evaluation.", "abstract_type": "editorial_summary", "abstract_source_url": "https://hai.stanford.edu/ai-index/2025-ai-index-report", "metadata_source": "Stanford HAI", "verification_status": "official_landing_page", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "aumshin2024", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:58; sections_axm/02_literature.tex:67", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:67", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:58", "entry_type": "techreport", "authors": "Aum, Sangmin and Shin, Yongseok", "title": "Is Software Eating the World?", "year": "2024", "venue": "National Bureau of Economic Research", "volume": "", "number": "32591", "pages": "", "doi": "10.3386/w32591", "document_url": "https://doi.org/10.3386/w32591", "landing_page_url": "https://doi.org/10.3386/w32591", "abstract": "When explaining the declining labor income share in advanced economies, the macro literature finds that the elasticity of substitution between capital and labor is greater than one.However, the vast majority of micro-level estimates shows that capital and labor are complements (elasticity less than one).Using firm-and establishment-level data from Korea, we divide capital into equipment and software, as they may interact with labor in different ways.Our estimation shows that equipment and labor are complements (elasticity 0.6), consistent with other micro-level estimates, but software and labor are substitutes (1.6), a novel finding that helps reconcile the macro vs. micro-literature elasticity discord.As the quality of software improves, labor shares fall within firms because of factor substitution and endogenously rising markups.In addition, production reallocates toward firms that use software more intensively, as they become effectively more productive.Because in the data these firms have higher markups and lower labor shares, the reallocation further raises the aggregate markup and reduces the aggregate labor share.The rise of software accounts for two-thirds of the labor share decline in Korea between 1990 and 2018.The factor substitution and the markup channels are equally important.On the other hand, the falling equipment price plays a minor role, because the factor substitution and the markup channels offset each other.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4399990048", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "gans2024", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:307; sections/02_literature.tex:99; sections/02_literature.tex:174; sections_axm/02_literature.tex:100; sections_axm/03_model.tex:411; sections_rewrite/02_literature.tex:84; sections_rewrite/03_model.tex:324", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:100; sections_axm/03_model.tex:411", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:307; sections/02_literature.tex:99; sections/02_literature.tex:174", "entry_type": "techreport", "authors": "Gans, Joshua S.", "title": "Market Power in Artificial Intelligence", "year": "2024", "venue": "National Bureau of Economic Research", "volume": "", "number": "32270", "pages": "", "doi": "10.3386/w32270", "document_url": "https://doi.org/10.3386/w32270", "landing_page_url": "https://doi.org/10.3386/w32270", "abstract": "This paper surveys the relevant existing literature that can help researchers and policy makers understand the drivers of competition in markets that constitute the provision of artificial intelligence products.The focus is on three broad markets: training data, input data, and AI predictions.It is shown that a key factor in determining the emergence and persistence of market power will be the operation of markets for data that would allow for trading data across firm boundaries.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4393359008", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "jones2024", "source_group": "manuscript_bibliography", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Jones, Charles I.", "title": "The AI Dilemma: Growth versus Existential Risk", "year": "2024", "venue": "American Economic Review: Insights", "volume": "6", "number": "4", "pages": "575--590", "doi": "10.1257/aeri.20230570", "document_url": "https://doi.org/10.1257/aeri.20230570", "landing_page_url": "https://doi.org/10.1257/aeri.20230570", "abstract": "Advances in artificial intelligence (AI) are a double-edged sword. On the one hand, they may increase economic growth as AI augments our ability to innovate. On the other hand, many experts worry that these advances entail existential risk: creating a superintelligence misaligned with human values could lead to catastrophic outcomes, even possibly human extinction. This paper considers the optimal use of AI technology in the presence of these opportunities and risks. Under what conditions should we continue the rapid progress of AI, and under what conditions should we stop? (JEL D11, D81, H43, I31, O31)", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4404713054", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "korinekvipra2025", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:307; sections/02_literature.tex:98; sections/02_literature.tex:174; sections_axm/02_literature.tex:100; sections_axm/03_model.tex:411; sections_rewrite/02_literature.tex:83; sections_rewrite/03_model.tex:324; sections_rewrite/06_conclusion.tex:48", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:100; sections_axm/03_model.tex:411", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:307; sections/02_literature.tex:98; sections/02_literature.tex:174", "entry_type": "techreport", "authors": "Korinek, Anton and Vipra, Jai", "title": "Concentrating Intelligence: Scaling and Market Structure in Artificial Intelligence", "year": "2024", "venue": "National Bureau of Economic Research", "volume": "", "number": "33139", "pages": "", "doi": "10.3386/w33139", "document_url": "https://doi.org/10.3386/w33139", "landing_page_url": "https://doi.org/10.3386/w33139", "abstract": "This paper examines the evolving structure and competition dynamics of the rapidly growing market for foundation models, with a focus on large language models (LLMs).We describe the technological characteristics that shape the AI industry and have given rise to fierce competition among the leading players.The paper analyzes the cost structure of foundation models, emphasizing the importance of key inputs such as computational resources, data, and talent, and identifies significant economies of scale and scope that may create a tendency towards greater market concentration in the future.We explore two concerns for competition, the risk of market tipping and the implications of vertical integration, and we evaluate policy remedies that aim to maintain a competitive landscape.Looking ahead to increasingly transformative AI systems, we discuss how market concentration could translate into unprecedented accumulation of power, highlighting the broader societal stakes of competition policy.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4404233233", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "Published in Economic Policy, 2025", "last_verified": "2026-09-04"}, {"citation_key": "metrrebench2024", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:184; sections_axm/01_introduction.tex:80", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/01_introduction.tex:80", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:184", "entry_type": "misc", "authors": "Model Evaluation and Threat Research", "title": "Evaluating Frontier AI R&D Capabilities of Language Model Agents against Human Experts", "year": "2024", "venue": "METR", "volume": "", "number": "", "pages": "", "doi": "", "document_url": "https://metr.org/blog/2024-11-22-evaluating-r-d-capabilities-of-llms/", "landing_page_url": "https://metr.org/blog/2024-11-22-evaluating-r-d-capabilities-of-llms/", "abstract": "RE-Bench compares language-model agents with human experts on machine-learning research-engineering tasks under different time budgets. In the original evaluation, humans retained a large advantage at the longest budget even though AI agents were competitive at shorter horizons.", "abstract_type": "editorial_summary", "abstract_source_url": "https://metr.org/blog/2024-11-22-evaluating-r-d-capabilities-of-llms/", "metadata_source": "METR", "verification_status": "official_landing_page", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "sastryetal2024", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_rewrite/03_model.tex:182", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Sastry, Girish and Heim, Lennart and Belfield, Haydn and others", "title": "Computing Power and the Governance of Artificial Intelligence", "year": "2024", "venue": "arXiv preprint arXiv:2402.08797", "volume": "", "number": "", "pages": "", "doi": "10.48550/arXiv.2402.08797", "document_url": "https://arxiv.org/abs/2402.08797", "landing_page_url": "https://doi.org/10.48550/arXiv.2402.08797", "abstract": "", "abstract_type": "unavailable", "abstract_source_url": "", "metadata_source": "manual", "verification_status": "manual_doi", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "sevillaroldan2024", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/01_introduction.tex:112", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:112", "entry_type": "misc", "authors": "Sevilla, Jaime and Roldán, Edu", "title": "Training Compute of Frontier AI Models Grows by 4--5x per Year", "year": "2024", "venue": "Epoch AI", "volume": "", "number": "", "pages": " ethod": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "guerreiroetal2023", "source_group": "manuscript_bibliography", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Guerreiro, Joao and Rebelo, Sergio and Teles, Pedro", "title": "Regulating Artificial Intelligence", "year": "2023", "venue": "National Bureau of Economic Research", "volume": "", "number": "31921", "pages": "", "doi": "10.3386/w31921", "document_url": "https://doi.org/10.3386/w31921", "landing_page_url": "https://doi.org/10.3386/w31921", "abstract": "We consider an environment in which there is substantial uncertainty about the potential negative external effects of AI algorithms.We find that subjecting algorithm implementation to regulatory approval or mandating testing is insufficient to implement the social optimum.When testing costs are low, a combination of mandatory testing for external effects and making developers liable for the negative external effects of their algorithms comes close to implementing the social optimum even when developers have limited liability.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W4389323839", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "Revised May 2026", "last_verified": "2026-09-04"}, {"citation_key": "trammellkorinek2023", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:40; sections/02_literature.tex:69; sections/02_literature.tex:120; sections/02_literature.tex:165; sections_axm/01_introduction.tex:149; sections_axm/02_literature.tex:33; sections_axm/02_literature.tex:85; sections_rewrite/02_literature.tex:11", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/01_introduction.tex:149; sections_axm/02_literature.tex:33; sections_axm/02_literature.tex:85", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:40; sections/02_literature.tex:69; sections/02_literature.tex:120; sections/02_literature.tex:165", "entry_type": "techreport", "authors": "Trammell, Philip and Korinek, Anton", "title": "Economic Growth under Transformative AI", "year": "2023", "venue": "National Bureau of Economic Research", "volume": "", "number": "31815", "pages": "", "doi": "10.3386/w31815", "document_url": "https://www.nber.org/system/files/working_papers/w31815/w31815.pdf", "landing_page_url": "https://www.nber.org/papers/w31815", "abstract": "Recent advances in AI may herald the near arrival of systems that can automate essentially all work. We review the macroeconomic implications of this scenario, in a framework synthesizing several strands of the relevant literature. Robustly, fully automating production alone (so that machines can self-replicate) would dramatically raise the growth rate and lower the labor share, breaking the Kaldor Facts that have long characterized frontier growth. Automating R&D (so that machines can self-improve) would accelerate the transformation, but may not produce it in isolation. Wages—the product of exploding output and a plummeting labor share—may rise or fall, depending on the returns to scale, the importance of natural resources, and the direction of technical change.", "abstract_type": "source_abstract", "abstract_source_url": "https://www.nber.org/papers/w31815", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "transformative AI; production automation; research automation; growth; labor share; wages; natural resources", "evidence_type": "theory synthesis", "method": "Macroeconomic framework separating automation of ordinary production from automation of research and development.", "key_results": "Full production automation can sharply raise growth and reduce labor's share; automating R&D accelerates the transformation, while wage effects depend on scale, resources, and technical change.", "use_in_axm": "Supports separating the production and research automation margins and distinguishing wage levels from labor's income share.", "limits_for_axm": "It does not use the A×M market structure or provide the paper's exact distributional decomposition.", "notes": "Revised April 2026", "last_verified": "2026-09-04"}, {"citation_key": "erdilbesiroglu2022", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_rewrite/03_model.tex:182", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Erdil, Ege and Besiroglu, Tamay", "title": "Algorithmic Progress in Computer Vision", "year": "2022", "venue": "arXiv preprint arXiv:2212.05153", "volume": "", "number": "", "pages": "", "doi": "10.48550/arXiv.2212.05153", "document_url": "https://arxiv.org/abs/2212.05153", "landing_page_url": "https://doi.org/10.48550/arXiv.2212.05153", "abstract": "", "abstract_type": "unavailable", "abstract_source_url": "", "metadata_source": "manual", "verification_status": "manual_doi", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "jones2022semiendogenous", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Jones, Charles I.", "title": "The Past and Future of Economic Growth: A Semi-Endogenous Perspective", "year": "2022", "venue": "Annual Review of Economics", "volume": "14", "number": "", "pages": "125--152", "doi": "10.1146/annurev-economics-080521-012458", "document_url": "https://web.stanford.edu/~chadj/annualreview.pdf", "landing_page_url": "https://www.annualreviews.org/content/journals/10.1146/annurev-economics-080521-012458", "abstract": "The nonrivalry of ideas gives rise to increasing returns, a fact celebrated in Paul Romer's recent Nobel Prize. An implication is that the long-run rate of economic growth is the product of the degree of increasing returns and the growth rate of research effort; this is the essence of semi-endogenous growth theory. This review interprets past and future growth from a semi-endogenous perspective. For 50+ years, US growth has substantially exceeded its long-run rate because of rising educational attainment, declining misallocation, and rising (global) research intensity, implying that frontier growth could slow markedly in the future. Other forces push in the opposite direction. First is the prospect of “finding new Einsteins”: How many talented researchers have we missed historically because of the underdevelopment of China and India and because of barriers that discouraged women inventors? Second is the longer-term prospect that artificial intelligence could augment or even replace people as researchers. Throughout, the review highlights many opportunities for further research.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W3194025919", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "semi-endogenous growth; research automation; singularity", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "mollrachelrestrepo2022", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Moll, Benjamin and Rachel, Lukasz and Restrepo, Pascual", "title": "Uneven Growth: Automation's Impact on Income and Wealth Inequality", "year": "2022", "venue": "Econometrica", "volume": "90", "number": "6", "pages": "2645--2683", "doi": "10.3982/ECTA19417", "document_url": "https://benjaminmoll.com/wp-content/uploads/2019/07/UG.pdf", "landing_page_url": "https://www.nber.org/papers/w28440", "abstract": "The benefits of new technologies accrue not only to high-skilled labor but also to owners of capital through higher capital incomes. The paper develops a tractable theory linking technology to personal income and wealth distributions and isolates a mechanism through which automation increases inequality via returns to wealth. Higher returns can coincide with stagnant wages and incomes at the bottom of the distribution.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.nber.org/papers/w28440", "metadata_source": "NBER and Econometrica", "verification_status": "official_landing_page", "topics": "automation; wealth inequality; income inequality; returns to wealth; wages; heterogeneous households", "evidence_type": "theory and quantitative distribution", "method": "Heterogeneous-household automation model linking factor returns to income and wealth distributions, with a multi-asset quantitative extension.", "key_results": "Automation can increase the return to wealth, raise top income and wealth concentration, and limit wage gains for workers with few assets.", "use_in_axm": "Clarifies why a functional decomposition of output is not enough to infer interpersonal inequality: ownership of capital and developer profit matters.", "limits_for_axm": "The A×M paper has a representative household and therefore does not reproduce this personal-distribution mechanism.", "notes": "Concise editorial synopsis of the official abstract; it is not author-written text.", "last_verified": "2026-09-04"}, {"citation_key": "raymookherjee2022", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_rewrite/02_literature.tex:55", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Ray, Debraj and Mookherjee, Dilip", "title": "Growth, Automation, and the Long-Run Share of Labor", "year": "2022", "venue": "Review of Economic Dynamics", "volume": "46", "number": "", "pages": "1--26", "doi": "10.1016/j.red.2021.09.003", "document_url": "https://www.nber.org/system/files/working_papers/w26658/w26658.pdf", "landing_page_url": "https://www.nber.org/papers/w26658", "abstract": "We study the long run implications of workplace automation induced by capital accumulation. We describe a minimal set of sufficient conditions for sustained growth, along with a declining labor share of income in the long run. The displacement of human labor is gradual, and absolute real wages could rise indefinitely. The results obtain in the absence of any technical progress and extend to endogenous technical progress.", "abstract_type": "source_abstract", "abstract_source_url": "https://www.nber.org/papers/w26658", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "automation; capital accumulation; labor share; wages; endogenous growth", "evidence_type": "theory", "method": "Long-run growth model with replicable physical capital, nonreplicable human capital, occupational mobility, and endogenous automation.", "key_results": "Capital accumulation can progressively automate production, drive labor's income share to zero, and sustain indefinitely rising real wages.", "use_in_axm": "Establishes that rising real wages can coexist with a vanishing labor share, a result the current paper does not claim as new.", "limits_for_axm": "It does not model autonomous AI research, a monopolistic supplier of AI services, or the current paper's threshold between labor-bottleneck and AI-dominated equilibria.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "nordhaus2021", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:39; sections/02_literature.tex:119; sections/02_literature.tex:165; sections_axm/02_literature.tex:33; sections_rewrite/02_literature.tex:31; sections_rewrite/06_conclusion.tex:54", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:33", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:39; sections/02_literature.tex:119; sections/02_literature.tex:165", "entry_type": "article", "authors": "Nordhaus, William D.", "title": "Are We Approaching an Economic Singularity? Information Technology and the Future of Economic Growth", "year": "2021", "venue": "American Economic Journal: Macroeconomics", "volume": "13", "number": "1", "pages": "299--332", "doi": "10.1257/mac.20170105", "document_url": "https://doi.org/10.1257/mac.20170105", "landing_page_url": "https://doi.org/10.1257/mac.20170105", "abstract": "What are the prospects for long-run economic growth? One prominent line of economic thinking is the trend toward stagnation. Stagnationism has a long history in economics, beginning prominently with Malthus and occasionally surfacing in different guises. Prominent themes here are the following: Will economic growth slow and perhaps even reverse under the weight of resource depletion? Will overpopulation and diminishing returns lower living standards? Will unchecked CO 2 emissions lead to catastrophic changes in climate and human systems? Have we depleted the store of potential great inventions? Will the aging society lead to diminished innovativeness? (JEL D83, E25, O31, O32, O41, O47)", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W3123260045", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "autoretal2020superstar", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Autor, David and Dorn, David and Katz, Lawrence F. and Patterson, Christina and Van Reenen, John", "title": "The Fall of the Labor Share and the Rise of Superstar Firms", "year": "2020", "venue": "Quarterly Journal of Economics", "volume": "135", "number": "2", "pages": "645--709", "doi": "10.1093/qje/qjaa004", "document_url": "https://academic.oup.com/qje/article-pdf/135/2/645/32996805/qjaa004.pdf", "landing_page_url": "https://academic.oup.com/qje/article-abstract/135/2/645/5721266", "abstract": "The paper uses U.S. Economic Census microdata to assess whether the decline in labor's share reflects reallocation toward superstar firms. Industries in which concentration rises most exhibit larger labor-share declines, and much of the aggregate decline comes from reallocation toward large, productive firms with high markups and low labor shares rather than from an equal decline within every firm.", "abstract_type": "editorial_summary", "abstract_source_url": "https://academic.oup.com/qje/article-abstract/135/2/645/5721266", "metadata_source": "Oxford Academic", "verification_status": "official_landing_page", "topics": "labor share; superstar firms; concentration; markups; reallocation; productivity", "evidence_type": "empirical", "method": "Firm-level panel evidence on concentration, markups, productivity, and between-firm reallocation.", "key_results": "Aggregate labor-share declines can reflect reallocation toward high-markup, low-labor-share firms rather than only within-firm factor substitution.", "use_in_axm": "Provides an empirical market-structure counterpart to the model's separation of labor payments and monopoly profit.", "limits_for_axm": "It does not identify advanced AI, inference or research compute, or a feedback-driven growth transition.", "notes": "Concise editorial synopsis of the official abstract; it is not author-written text.", "last_verified": "2026-09-04"}, {"citation_key": "barkai2020", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Barkai, Simcha", "title": "Declining Labor and Capital Shares", "year": "2020", "venue": "Journal of Finance", "volume": "75", "number": "5", "pages": "2421--2463", "doi": "10.1111/jofi.12909", "document_url": "https://onlinelibrary.wiley.com/doi/pdf/10.1111/jofi.12909", "landing_page_url": "https://onlinelibrary.wiley.com/doi/abs/10.1111/jofi.12909", "abstract": "This paper presents direct measures of capital costs, equal to the product of the required rate of return on capital and the value of the capital stock. The capital share does not offset the decline in the labor share. Instead, a large increase in the share of pure profits offsets declines in the shares of both labor and capital. Industry data show that increases in concentration are associated with declines in the labor share.", "abstract_type": "source_abstract", "abstract_source_url": "https://onlinelibrary.wiley.com/doi/abs/10.1111/jofi.12909", "metadata_source": "Wiley", "verification_status": "official_landing_page", "topics": "labor share; capital share; pure profits; concentration; market power; accounting", "evidence_type": "empirical measurement", "method": "Direct measurement of capital costs and pure profits using U.S. national and industry accounts.", "key_results": "The decline in labor's share need not reappear as competitive capital income; both labor and capital shares can fall while pure profits rise.", "use_in_axm": "Supports separating the fixed gross capital payment from developer profit when interpreting the fall in labor's share.", "limits_for_axm": "The evidence concerns historical U.S. accounts and concentration, not the allocation of AI compute or the asymptotic regimes of the model.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "hernandezbrown2020", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_rewrite/03_model.tex:182", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Hernandez, Danny and Brown, Tom B.", "title": "Measuring the Algorithmic Efficiency of Neural Networks", "year": "2020", "venue": "arXiv preprint arXiv:2005.04305", "volume": "", "number": "", "pages": "", "doi": "10.48550/arXiv.2005.04305", "document_url": "https://arxiv.org/abs/2005.04305", "landing_page_url": "https://doi.org/10.48550/arXiv.2005.04305", "abstract": "", "abstract_type": "unavailable", "abstract_source_url": "", "metadata_source": "manual", "verification_status": "manual_doi", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "acemoglurestrepo2019", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:51; sections/03_toy_model.tex:971; sections_axm/01_introduction.tex:149; sections_axm/02_literature.tex:83; sections_axm/06_conclusion.tex:68; sections_rewrite/02_literature.tex:48; sections_rewrite/03_model.tex:83; sections_rewrite/06_conclusion.tex:45", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/01_introduction.tex:149; sections_axm/02_literature.tex:83; sections_axm/06_conclusion.tex:68", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:51; sections/03_toy_model.tex:971", "entry_type": "article", "authors": "Acemoglu, Daron and Restrepo, Pascual", "title": "Automation and New Tasks: How Technology Displaces and Reinstates Labor", "year": "2019", "venue": "Journal of Economic Perspectives", "volume": "33", "number": "2", "pages": "3--30", "doi": "10.1257/jep.33.2.3", "document_url": "https://www.aeaweb.org/articles/pdf/doi/10.1257/jep.33.2.3", "landing_page_url": "https://doi.org/10.1257/jep.33.2.3", "abstract": "We present a framework for understanding the effects of automation and other types of technological changes on labor demand, and use it to interpret changes in US employment over the recent past. At the center of our framework is the allocation of tasks to capital and labor—the task content of production. Automation, which enables capital to replace labor in tasks it was previously engaged in, shifts the task content of production against labor because of a displacement effect. As a result, automation always reduces the labor share in value added and may reduce labor demand even as it raises productivity. The effects of automation are counterbalanced by the creation of new tasks in which labor has a comparative advantage. The introduction of new tasks changes the task content of production in favor of labor because of a reinstatement effect, and always raises the labor share and labor demand. We show how the role of changes in the task content of production—due to automation and new tasks—can be inferred from industry-level data. Our empirical decomposition suggests that the slower growth of employment over the last three decades is accounted for by an acceleration in the displacement effect, especially in manufacturing, a weaker reinstatement effect, and slower growth of productivity than in previous decades.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W2922903482", "metadata_source": "OpenAlex", "verification_status": "doi_metadata_matched", "topics": "automation; new tasks; displacement; reinstatement; labor share; employment; wages", "evidence_type": "theory and empirical decomposition", "method": "Task framework separating automation's displacement effect from the reinstatement effect of new human tasks, combined with an industry-level empirical decomposition.", "key_results": "Automation lowers labor demand and labor's share through displacement; new tasks raise both through reinstatement.", "use_in_axm": "Establishes the general distributional mechanism that the A×M paper takes as known rather than claiming as new.", "limits_for_axm": "It does not model AI-research feedback, rival inference and research compute, monopoly pricing, or delayed explosive growth.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "aghionjonesjones2019", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:34; sections/02_literature.tex:92; sections/02_literature.tex:119; sections/02_literature.tex:150; sections/03_toy_model.tex:1792; sections/04_task_extension.tex:14; sections_axm/02_literature.tex:30; sections_axm/02_literature.tex:74; sections_axm/04_growth_regimes.tex:24; sections_rewrite/02_literature.tex:9", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:30; sections_axm/02_literature.tex:74; sections_axm/04_growth_regimes.tex:24", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:34; sections/02_literature.tex:92; sections/02_literature.tex:119; sections/02_literature.tex:150; sections/03_toy_model.tex:1792; sections/04_task_extension.tex:14", "entry_type": "incollection", "authors": "Aghion, Philippe and Jones, Benjamin F. and Jones, Charles I.", "title": "Artificial Intelligence and Economic Growth", "year": "2019", "venue": "The Economics of Artificial Intelligence: An Agenda", "volume": "", "number": "", "pages": "237--290", "doi": "", "document_url": "https://www.nber.org/papers/w23928.pdf", "landing_page_url": "https://www.nber.org/papers/w23928", "abstract": "This paper examines the potential impact of artificial intelligence (A.I.) on economic growth. We model A.I. as the latest form of automation, a broader process dating back more than 200 years. Electricity, internal combustion engines, and semiconductors facilitated automation in the last century, but A.I. now seems poised to automate many tasks once thought to be out of reach, from driving cars to making medical recommendations and beyond. How will this affect economic growth and the division of income between labor and capital? What about the potential emergence of singularities and superintelligence? How will the linkages between A.I. and growth be mediated by firm-level considerations, including organization and market structure? The goal throughout is to refine a set of critical questions about A.I. and economic growth and to contribute to shaping an agenda for the field. One theme that emerges is based on Baumol's cost disease insight: growth may be constrained not by what we are good at but rather by what is essential and yet hard to improve.", "abstract_type": "source_abstract", "abstract_source_url": "https://www.nber.org/papers/w23928", "metadata_source": "NBER", "verification_status": "manual_url", "topics": "artificial intelligence; automation; economic growth; bottlenecks; Baumol cost disease; singularity", "evidence_type": "theory and illustrative simulation", "method": "Task-automation extensions of growth models, including automation in goods and idea production and essential-task bottlenecks.", "key_results": "Automation can raise growth sharply, but essential tasks that remain difficult to automate can bind aggregate growth for a prolonged period.", "use_in_axm": "Early antecedent for the claim that bottlenecks can keep aggregate growth modest even while automation advances.", "limits_for_axm": "The numerical automation path is exogenous, so it is not the closest precedent for the endogenous timing of the A×M takeoff.", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "acemoglurestrepo2018", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "article", "authors": "Acemoglu, Daron and Restrepo, Pascual", "title": "The Race between Man and Machine: Implications of Technology for Growth, Factor Shares, and Employment", "year": "2018", "venue": "American Economic Review", "volume": "108", "number": "6", "pages": "1488--1542", "doi": "10.1257/aer.20160696", "document_url": "https://www.aeaweb.org/articles/pdf/doi/10.1257/aer.20160696", "landing_page_url": "https://www.aeaweb.org/articles?id=10.1257/aer.20160696", "abstract": "We examine the concerns that new technologies will render labor redundant in a framework in which tasks previously performed by labor can be automated and new versions of existing tasks, in which labor has a comparative advantage, can be created. In a static version where capital is fixed and technology is exogenous, automation reduces employment and the labor share, and may even reduce wages, while the creation of new tasks has the opposite effects. Our full model endogenizes capital accumulation and the direction of research toward automation and the creation of new tasks. If the long-run rental rate of capital relative to the wage is sufficiently low, the long-run equilibrium involves automation of all tasks. Otherwise, there exists a stable balanced growth path in which the two types of innovations go hand-in-hand.", "abstract_type": "source_abstract", "abstract_source_url": "https://www.aeaweb.org/articles?id=10.1257/aer.20160696", "metadata_source": "American Economic Association", "verification_status": "official_landing_page", "topics": "automation; tasks; labor share; wages; factor shares; endogenous growth", "evidence_type": "theory", "method": "Task-based growth model with endogenous capital accumulation and directed innovation toward automation or new human tasks.", "key_results": "Automation displaces labor and lowers its income share; new human tasks generate a reinstatement force. Depending on relative factor costs, the long run can feature full automation or a stable balanced-growth path with both types of innovation.", "use_in_axm": "Canonical antecedent for the displacement--reinstatement mechanism and for the possibility that wages and labor's share move differently.", "limits_for_axm": "It does not separate inference from research compute, model monopoly rents, or characterize the delayed feedback-driven takeoff studied in the A×M paper.", "notes": "Excerpt from the official author abstract; the omitted closing sentences discuss stability and inequality with heterogeneous skills.", "last_verified": "2026-09-04"}, {"citation_key": "dyatlov2018", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections_rewrite/appendix_finite_frontier.tex:219", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "misc", "authors": "Dyatlov, Semyon", "title": "Notes on Hyperbolic Dynamics", "year": "2018", "venue": "", "volume": "", "number": "", "pages": "", "doi": "10.48550/arXiv.1805.11660", "document_url": "https://arxiv.org/abs/1805.11660", "landing_page_url": "https://doi.org/10.48550/arXiv.1805.11660", "abstract": "", "abstract_type": "unavailable", "abstract_source_url": "", "metadata_source": "manual", "verification_status": "manual_doi", "topics": "", "evidence_type": "", "method": "", "key_results": "", "use_in_axm": "", "limits_for_axm": "", "notes": "", "last_verified": "2026-09-04"}, {"citation_key": "karabarbounisneiman2018factorless", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Karabarbounis, Loukas and Neiman, Brent", "title": "Accounting for Factorless Income", "year": "2018", "venue": "NBER Working Paper", "volume": "", "number": "24404", "pages": "", "doi": "10.3386/w24404", "document_url": "https://www.nber.org/system/files/working_papers/w24404/w24404.pdf", "landing_page_url": "https://www.nber.org/papers/w24404", "abstract": "Comparing U.S. GDP with measured labor payments and imputed capital rental payments leaves a large and volatile residual, which the paper calls factorless income. It evaluates three interpretations of that residual: economic profits, unmeasured capital, or deviations of the rental rate from standard measures. The preferred interpretation materially changes measured factor shares, technology growth, and functional inequality.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.nber.org/papers/w24404", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "factorless income; profits; unmeasured capital; rental rate; factor shares; accounting", "evidence_type": "measurement and accounting", "method": "National-accounts decomposition under alternative interpretations of output not assigned to measured labor or imputed capital services.", "key_results": "The inferred distribution and technology depend critically on whether the residual is treated as profit, unmeasured capital, or a rental-rate wedge.", "use_in_axm": "Motivates explicit accounting of capital payments, compute resource uses, wages, and developer profit instead of assigning the residual mechanically to capital or rents.", "limits_for_axm": "It is an accounting exercise, not a model of AI services, research feedback, or endogenous takeoff.", "notes": "Concise editorial synopsis of the official abstract; it is not author-written text.", "last_verified": "2026-09-04"}, {"citation_key": "korinekstiglitz2017", "source_group": "conversation_addition", "cited_in_manuscript": "no", "citation_locations": "", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "no", "citation_locations_legacy": "", "entry_type": "techreport", "authors": "Korinek, Anton and Stiglitz, Joseph E.", "title": "Artificial Intelligence and Its Implications for Income Distribution and Unemployment", "year": "2017", "venue": "NBER Working Paper", "volume": "", "number": "24174", "pages": "", "doi": "10.3386/w24174", "document_url": "https://www.nber.org/system/files/working_papers/w24174/w24174.pdf", "landing_page_url": "https://www.nber.org/papers/w24174", "abstract": "Inequality is one of the main challenges posed by the proliferation of artificial intelligence and other forms of worker-replacing technological progress. The paper distinguishes two main distributional channels: surplus accruing to innovators and redistribution arising from factor-price changes. It also studies policy responses and the channels through which technological progress may produce technological unemployment, including in a singularity where machines dominate human labor.", "abstract_type": "editorial_summary", "abstract_source_url": "https://www.nber.org/papers/w24174", "metadata_source": "NBER", "verification_status": "official_landing_page", "topics": "artificial intelligence; income distribution; innovator surplus; factor prices; unemployment; policy", "evidence_type": "theory and policy taxonomy", "method": "Taxonomy and a set of stylized models of worker-replacing technical change, factor-price redistribution, innovator surplus, and policy.", "key_results": "AI can redistribute income both through factor prices and through rents captured by innovators; those channels require different policy responses.", "use_in_axm": "Supports the distinction between redistribution through factor prices and surplus captured by the innovator.", "limits_for_axm": "It does not provide the A×M technology, the two substitution thresholds, or the numerical delayed-takeoff transition.", "notes": "Concise editorial synopsis of the official abstract; it is not author-written text.", "last_verified": "2026-09-04"}, {"citation_key": "karabarbounisneiman2014", "source_group": "manuscript_bibliography", "cited_in_manuscript": "yes", "citation_locations": "sections/02_literature.tex:55; sections_rewrite/02_literature.tex:52", "cited_in_axm": "no", "citation_locations_axm": "", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/02_literature.tex:55", "entry_type": "article", "authors": "Karabarbounis, Loukas and Neiman, Brent", "title": "The Global Decline of the Labor Share", "year": "2014", "venue": "Quarterly Journal of Economics", "volume": "129", "number": "1", "pages": "61--103", "doi": "10.1093/qje/qjt032", "document_url": "https://doi.org/10.1093/qje/qjt032", "landing_page_url": "https://doi.org/10.1093/qje/qjt032", "abstract": "Abstract The stability of the labor share of income is a key foundation in macroeconomic models. We document, however, that the global labor share has significantly declined since the early 1980s, with the decline occurring within the large majority of countries and industries. We show that the decrease in the relative price of investment goods, often attributed to advances in information technology and the computer age, induced firms to shift away from labor and toward capital. The lower price of investment goods explains roughly half of the observed decline in the labor share, even when we allow for other mechanisms influencing factor shares, such as increasing profits, capital-augmenting technology growth, and the changing skill composition of the labor force. We highlight the implications of this explanation for welfare and macroeconomic dynamics.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://openalex.org/W2155379226", "metadata_source": "Open
