n_locations": "sections/01_introduction.tex:234; sections/02_literature.tex:9; sections_axm/02_literature.tex:5; sections_rewrite/02_literature.tex:7", "cited_in_axm": "yes", "citation_locations_axm": "sections_axm/02_literature.tex:5", "cited_in_legacy": "yes", "citation_locations_legacy": "sections/01_introduction.tex:234; sections/02_literature.tex:9", "entry_type": "article", "authors": "Aghion, Philippe and Howitt, Peter", "title": "A Model of Growth through Creative Destruction", "year": "1992", "venue": "Econometrica", "volume": "60", "number": "2", "pages": "323--351", "doi": "10.2307/2951599", "document_url": "https://doi.org/10.2307/2951599", "landing_page_url": "https://doi.org/10.2307/2951599", "abstract": "This paper develops a model based on Schumpeter's process of creative destruction. It departs from existing models of endogenous growth in emphasizing obsolescence of old technologies induced by the accumulation of knowledge and the resulting process or industrial innovations. This has both positive and normative implications for growth. In positive terms, the prospect of a high level of research in the future can deter research today by threatening the fruits of that research with rapid obsolescence. In normative terms, obsolescence creates a negative externality from innovations, and hence a tendency for laissez-faire economies to generate too many innovations, i.e too much growth. This business-stealing effect is partly compensated by the fact that innovations tend to be too small under laissez-faire. The model possesses a unique balanced growth equilibrium in which the log of GNP follows a random walk with drift. The size of the drift is the average growth rate of the economy and it is endogenous to the model ; in particular it depends on the size and likelihood of innovations resulting from research and also on the degree of market power available to an innovator.", "abstract_type": "openalex_indexed_abstract", "abstract_source_url": "https://ope function reviewBlock(x){
  const rows=[
    ["Método",x.method,""],
    ["Resultado principal",x.key_results,""],
    ["Uso en el paper A×M",x.use_in_axm,""],
    ["Límite para A×M",x.limits_for_axm,"limit"]
  ].filter(row=>row[1]);
  if(!rows.length)return "";
  return "<div class=\"review\">"+rows.map(row=>
    "<section class=\""+row[2]+"\"><h3>"+esc(row[0])+"</h3><p>"+esc(row[1])+"</p></section>"
  ).join("")+"</div>";
}

function traceBlock(x){
  const rows=[
    ["Clave",x.citation_key],
    ["Tipo de evidencia",x.evidence_type],
    ["Citas en A×M",x.citation_locations_axm],
    ["Citas en el paper anterior",x.citation_locations_legacy],
    ["Tipo de resumen",x.abstract_type],
    ["Estado de verificación",x.verification_status],
    ["Fecha de compilación",x.last_verified],
    ["Notas",x.notes]
  ].filter(row=>row[1]);
  return "<details><summary>Metadatos y trazabilidad</summary><dl class=\"trace\">"+
    rows.map(row=>"<dt>"+esc(row[0])+"</dt><dd>"+esc(row[1])+"</dd>").join("")+
    "</dl></details>";
}

function render(){
  const q=document.querySelector("#q").value.toLowerCase().trim();

  const topic=document.querySelector("#topic").value;
  const etype=document.querySelector("#etype").value;
  const atype=document.querySelector("#atype").value;
  const rows=records.filter(x=>{
    const hay=Object.values(x).join(" ").toLowerCase();
    const corpus=!paper||
      (paper==="axm"&&x.cited_in_axm==="yes")||
      (paper==="legacy"&&x.cited_in_legacy==="yes")||
      (paper==="addition"&&x.source_group==="conversation_addition");
    const topicMatch=!topic||splitTopics(x).some(v=>v.toLowerCase()===topic);
    const abstractMatch=!atype||
      (atype==="editorial_summary"&&isEditorial(x))||
      (atype==="abstract"&&isAbstract(x))||
      (atype==="unavailable"&&x.abstract_type==="unavailable");
    return(!q||hay.includes(q))&&corpus&&topicMatch&&(!etype||x.evidence_type===etype)&&abstractMatch;
  });
  const axmShown=rows.filter(x=>x.cited_in_axm==="yes").length;

    rows.length+" de "+records.length+" referencias · "+axmShown+" citadas en A×M";

    const topics=splitTopics(x).map(v=>"<span class=\"tag topic\">"+esc(v)+"</span>").join("");

    if(x.cited_in_legacy==="yes")html+="<span class=\"tag legacy\">Paper anterior</span>";
    html+="<span class=\"tag\">"+esc(sourceLabels[x.source_group]||x.source_group)+"</span></div>";
    html+="<h2>"+esc(x.title)+"</h2><div class=\"meta\">"+esc(x.authors)+" · "+esc(x.venue)+"</div>";
    html+="<div class=\"tags\">"+topics+"</div>";
    html+="<div class=\"abstract\"><h3>"+esc(abstractLabel)+"</h3><p>"+
      (esc(x.abstract)||"<em>Resumen no disponible.</em>")+"</p></div>";

    if(x.document_url)html+="<a href=\""+esc(x.document_url)+"\" target=\"_blank\" rel=\"noopener\">Documento</a>";

    html+="</div>"+traceBlock(x)+"</article>";
    return html;
  }).join(""):"<div class=\"empty\">No hay resultados para estos filtros.</div>";
}

);
